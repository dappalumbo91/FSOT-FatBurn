# FSOT Fat Burn — project configuration
# Paths: relative to this folder, or ${VAR:-default} (env override with a repo-relative default).

project:
  name: FSOT Fat Burn
  root: "."
  version: "0.1.0"
  epistemic_tier: scaffold_to_measured  # numeric claims re-verify against archive gates

fsot:
  archive_root: "${FSOT_ARCHIVE_ROOT:-data_external/physical_archive}"
  lean_hub: "${FSOT_2_1_LEAN_ROOT:-../FSOT-2.1-Lean}"
  compute_module: "${FSOT_2_1_LEAN_ROOT:-../FSOT-2.1-Lean}/vendor/fsot_compute.py"
  public_data: "${FSOT_ARCHIVE_ROOT:-data_external/physical_archive}/03_FSOT-PublicData"
  smiles_dataset: "${FSOT_2_1_LEAN_ROOT:-../FSOT-2.1-Lean}/vendor/smiles/FSOT_SMILES_Lab_Dataset.json"
  pubchem_cache: "${FSOT_ARCHIVE_ROOT:-data_external/physical_archive}/03_FSOT-PublicData/pubchem/pubchem_cache.json"
  chembl_cache: "${FSOT_2_1_LEAN_ROOT:-../FSOT-2.1-Lean}/data/pharmacology_chembl_cache.json"
  # Domain folds from FSOT 2.1 (Biology / Biochemistry / Thermodynamics)
  domains:
    adipocyte_white: { D_eff: 12, delta_psi: 0.08, recent_hits: 0, observed: false, name: Biology }
    adipocyte_brown: { D_eff: 12, delta_psi: 0.15, recent_hits: 1, observed: true, name: Biology }
    lipolysis_enzyme: { D_eff: 13, delta_psi: 0.35, recent_hits: 1, observed: true, name: Biochemistry }
    thermogenesis: { D_eff: 15, delta_psi: 0.9, recent_hits: 1, observed: true, name: Thermodynamics }
    fluid_water: { D_eff: 15, delta_psi: 0.9, recent_hits: 1, observed: false, name: Fluid_Dynamics }
    exercise_mech: { D_eff: 12, delta_psi: 0.2, recent_hits: 1, observed: true, name: Biology }

apis:
  pubchem_pug: "https://pubchem.ncbi.nlm.nih.gov/rest/pug"
  chembl: "https://www.ebi.ac.uk/chembl/api/data"
  openfda: "https://api.fda.gov/drug"
  rxnav: "https://rxnav.nlm.nih.gov/REST"
  clinicaltrials: "https://clinicaltrials.gov/api/v2"
  openfoodfacts: "https://world.openfoodfacts.org"
  usda_fdc: "https://api.nal.usda.gov/fdc/v1"  # needs FDC_API_KEY env if used live
  user_agent: "FSOT-FatBurn/0.1 (research simulator; local archive primary)"

somatotypes:
  default: meso_endo
  pure: [ectomorph, mesomorph, endomorph]
  hybrids: [ecto_meso, meso_endo, ecto_endo]

panel_export:
  domain: Adipose_Lipolysis_Live_Panel
  lean_module: FSOT.Formal.AdiposeLipolysisPanelPriors
  benchmark: data/adipose_lipolysis_panel_benchmark.json

simulation:
  dt_hours: 1.0
  default_days: 28
  kcal_per_kg_fat: 7700.0
  glycogen_water_ratio: 3.0   # g water bound per g glycogen (order-of-magnitude physiology)
  seed_rng: 42

paths:
  seed: "data/seed"
  cache: "data/cache"
  derived: "data/derived"
  reports: "reports"
